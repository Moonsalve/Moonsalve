<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Juan Monsalve — Systems and Computing Engineer, Software Engineer. Backend, cloud and applied AI. Colombia.">
  <defs>
    <!-- Franja de peligro: el mismo recurso que estructura jmonsalve.dev. -->
    <pattern id="hazard" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="28" height="28" fill="#0a0a0a"/>
      <rect width="14" height="28" fill="#e61919"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="#0a0a0a"/>

  <!-- Reglas de 2 px arriba y abajo, compartimentando como en el sitio. -->
  <rect x="0" y="0" width="1200" height="14" fill="url(#hazard)"/>
  <rect x="0" y="286" width="1200" height="14" fill="url(#hazard)"/>

  <!-- Bloque de identidad. textLength fija el ancho para que la caja no
       dependa de qué fuente resuelva cada plataforma. -->
  <text x="72" y="132" fill="#f4f4f0"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="76" font-weight="700" letter-spacing="-1"
        textLength="600" lengthAdjust="spacingAndGlyphs">JUAN MONSALVE</text>

  <rect x="72" y="156" width="600" height="2" fill="#e61919"/>

  <text x="72" y="192" fill="#ff2a2a"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="700" letter-spacing="2.4"
        textLength="600" lengthAdjust="spacingAndGlyphs">SYSTEMS &amp; COMPUTING ENGINEER</text>

  <text x="72" y="224" fill="#8a8a85"
        font-family="SF Mono, Menlo, Consolas, monospace"
        font-size="17" letter-spacing="1.6"
        textLength="560" lengthAdjust="spacingAndGlyphs">SOFTWARE ENGINEER — BACKEND · CLOUD · APPLIED AI</text>

  <text x="72" y="254" fill="#5c5c58"
        font-family="SF Mono, Menlo, Consolas, monospace"
        font-size="15" letter-spacing="1.4"
        textLength="330" lengthAdjust="spacingAndGlyphs">COLOMBIA · GMT−5 · JMONSALVE.DEV</text>

  <!-- Rejilla de compartimentos a la derecha. Geometría, no datos: una
       gráfica inventada aquí contradiría el criterio del portafolio. -->
  <g fill="none" stroke="#1f1f1f" stroke-width="2">
    <rect x="800" y="58" width="104" height="104"/>
    <rect x="920" y="58" width="104" height="104"/>
    <rect x="1040" y="58" width="88" height="104"/>
    <rect x="800" y="178" width="104" height="64"/>
    <rect x="920" y="178" width="208" height="64"/>
  </g>
  <rect x="920" y="58" width="104" height="104" fill="#e61919"/>
  <rect x="800" y="178" width="104" height="64" fill="#1f1f1f"/>
</svg>
